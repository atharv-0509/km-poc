[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "km-poc"
version = "0.1.0"
description = "Retrieval-first knowledge management PoC for the Minister's Office"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # core runs on the standard library alone

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
formats = ["openpyxl>=3.1", "pymupdf>=1.24", "python-pptx>=0.6", "python-docx>=1.1"]
gdrive = ["google-api-python-client>=2.0", "google-auth>=2.0"]
ocr = ["pytesseract>=0.3", "Pillow>=9.0"]
llm = ["llama-cpp-python>=0.2"]

[project.scripts]
km = "km.cli:main"

[tool.setuptools]
packages = ["km", "km.ingest"]
